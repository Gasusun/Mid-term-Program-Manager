<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a class = "active" href="calculator.html">Calculator</a></li>
        <li><a href="galleria.html">Galleria</a></li>
    </ul>

    <div class="wrapper">
        <section class="screen">
            0
        </section>
        <section class="cal-button-container">
            <div class="cal-button-row">
                <button class="cal-button">
                    c
                </button>
                <button class="cal-button">
                    &larr;
                </button>
                <button class="cal-button">
                    &divide;
                </button>
                </div>
                <div class="cal-button-row">
                    <button class="cal-button">
                        7
                    </button>
                    <button class="cal-button">
                        8
                    </button>
                    <button class="cal-button">
                        9
                    </button>
                    <button class="cal-button">
                        &times;
                    </button>
            </div>
            <div class="cal-button-row">
                <button class="cal-button">
                    4
                </button>
                <button class="cal-button">
                    5
                </button>
                <button class="cal-button">
                    6
                </button>
                <button class="cal-button">
                    &minus;
                </button>
                </div>
                <div class="cal-button-row">
                    <button class="cal-button">
                        1
                    </button>
                    <button class="cal-button">
                        2
                    </button>
                    <button class="cal-button">
                        3
                    </button>
                    <button class="cal-button">
                        &plus;
                    </button>
                </div>
                <div class="cal-button-row">
                    <button class="cal-button">
                        0
                    </button>
                    <button class="cal-button">
                        &equals;
                    </button>
                </div>
        </section>
    </div>
    <script src="js.js"></script>
</body>
</html>
